<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dopamine Rehab Dashboard</title>
</head>
<body class="bg-body-tertiary">
    <div class="d-flex" id="wrapper">
        <div class="bg-body border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-primary text-white py-2 px-3">
                <h5 class="mb-0 user-select-none" id="logo-title">Dopamine Rehab</h5>
            </div>
            <div class="list-group list-group-flush" id="sidebar-links">
                <!-- Links are injected here -->
            </div>
            <div class="p-2 border-top mt-auto">
                <form id="custom-url-form" novalidate>
                    <div class="input-group input-group-sm has-validation">
                        <input type="text" id="custom-url-input" class="form-control" placeholder="Add URL..." required>
                        <button type="submit" class="btn btn-primary" id="add-custom-url-btn">+</button>
                        <div class="invalid-feedback">
                            Please enter a valid URL or domain.
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="page-content-wrapper" class="flex-grow-1">
            <nav class="navbar navbar-expand-lg border-bottom py-2 px-3">
                <div class="container-fluid">
                    <h5 id="selected-url-title" class="mb-0">Select a site</h5>
                    <div class="ms-auto">
                        <span id="status" class="status badge bg-info text-dark me-2"></span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-3">
                <div id="config-panel" class="card shadow-sm d-none">
                    <div class="card-body">
                        <div id="actions-container">
                            <!-- Actions will be injected here -->
                        </div>
                        <div class="mt-3">
                            <button id="add-action-btn" type="button" class="btn btn-primary btn-sm">Add Action</button>
                        </div>
                        <div class="mt-4 pt-3 border-top">
                            <button id="remove-site-btn" type="button" class="btn btn-danger btn-sm">Remove site</button>
                        </div>
                    </div>
                </div>
                <div id="no-selection-msg" class="text-center mt-5 text-muted small">
                    <p>Add a new site to configure.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../dashboard.js"></script>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmDeleteModalLabel">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmDeleteModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
